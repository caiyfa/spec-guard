# ─────────── 人读层：doc ───────────
id: PP-RC-003
title: DHR-only 人员走 DHR 降级（仅 basicInfo，实时查询 DHR）
version: "0.1"
priority: P1
tags: [resolver]
doc:
  given: 人员不在 TDM（tdm_emp_employee 无记录）但在 DHR（dhr_employee）中存在
  when: 调用 GET /api/employee/profile?empNo=xxx
  then: 返回 ProfileVO，仅 basicInfo 有数据（DhrFallbackProfileResolver 实时查询 DHR），其余业务模块为 null；basicInfo 与 DHR 最新分区记录一致
  covers: [FR-001]
  dimensions: [happy-path, state]
  related_ac: [AC-003]
  related_edge: "spec §6 无快照 / DHR 降级路径"

# ─────────── 机器读层 ───────────
depends_on: []
flow:
  - tool: {use: select_emp, with: {role: dhr_only}, save: emp}
  - call:
      as: default
      method: GET
      path: /api/employee/profile
      params: {empNo: "{{emp.no}}", resourceCode: "{{env.resource_code}}"}
      save: resp
verify:
  - status: {eq: 200}
  - json: {path: "$.data.basicInfo.empNo", eq: "{{emp.no}}"}
  - json: {path: "$.data.basicInfo.empName", not_null: true}
  - oracle: dhr_fallback_matches
