# ─────────── 人读层：doc ───────────
id: PP-RC-002
title: 无快照人员走员工表兜底（仅 basicInfo 有数据）
version: "0.1"
priority: P1
tags: [resolver]
doc:
  given: 人员在 tdm_emp_employee 中存在但从未被盘点锁定（无任何快照记录）
  when: 调用 GET /api/employee/profile?empNo=xxx
  then: 返回 ProfileVO，仅 basicInfo 有数据（基于员工表字段构建），其余业务模块为 null
  covers: [FR-001]
  related_ac: [AC-003]
  related_edge: "spec §6 无快照"

# ─────────── 机器读层 ───────────
depends_on: []
flow:
  - tool: {use: select_emp, with: {role: no_snapshot_tdm}, save: emp}
  - call:
      as: default
      method: GET
      path: /api/employee/profile
      params: {empNo: "{{emp.no}}", resourceCode: "{{env.resource_code}}"}
      save: resp
verify:
  - status: {eq: 200}
  - json: {path: "$.data.basicInfo.empNo", eq: "{{emp.no}}"}
  - json: {path: "$.data.basicInfo.empName", not_null: true}
  - oracle: profile_matches_db
