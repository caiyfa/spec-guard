# SpecGuard 跨系统共享环境配置 — SIT
# ══════════════════════════════════════════════════════════
# 通用配置（跨被测系统复用）：放本目录，引擎加载时「共享打底 + 系统覆盖」。
# 系统专属配置（网关/账号池/资源码/业务 token 等）仍放 systems/{system}/config/env.{env}.yaml。
# 合并语义：顶层键级——系统文件的键整体覆盖共享同键（段内不逐字段合并）。
# ══════════════════════════════════════════════════════════

# 集团 SSO（Authing）登录配置 —— 多系统共用同一身份体系时放这里
sso:
  domain: "http://sso.sit-authing.fehorizon.com"
  app_id: "650d55be5fb1d2cc66d9a550"
  # SIT 环境测试账号统一密码（fe-switch 插件公开约定）；可用 SG_SSO_PASSWORD 覆盖
  password: "${SG_SSO_PASSWORD:Fehorizon123.}"

# internal token 服务凭证（client-credentials grant）—— 多系统共用同一 UAC 时放这里
internal_token:
  url: "http://sit-ha.fehorizon.com/femsp/uac/api/authing/grant/internaltoken"
  client_id: "6530959bc23d3ce70acf228e"
  # T-960 凭据出库：client_secret 不硬编码仓库，走环境变量回退（与 SG_DB_PASSWORD 同模式）。
  # 本地开发可回退读 ~/.qoder/skills/devops/scripts/.env.devops 的 SG_TDM_CLIENT_SECRET；
  # 生产/CI 用环境变量 SG_TDM_CLIENT_SECRET 注入；缺省时 token 获取将诚实报错提示配置。
  client_secret: "${SG_TDM_CLIENT_SECRET:}"
  scope: "internal"

# 占位符：${环境变量名:默认值} 与系统层同口径；DB 密码回退链在系统层 load_env 处理
