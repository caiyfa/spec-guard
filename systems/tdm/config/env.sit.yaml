# SpecGuard TDM 系统 — SIT 环境配置
# 占位符语法：${环境变量名:默认值}

system: tdm
env: sit

# TDM 业务网关（本机可达的 HA 入口；sit-tdm.fehorizon.com 为另一网关，按需切换）
tdm_base: "http://sit-ha.fehorizon.com/femsp/hr-tdm"

# 默认服务名（T-972 引擎去 TDM 化）：call/poll 未声明 service 时路由到 tdm_base
default_service: tdm

# ───── TDM service URLs (added 2026-08-26, HI-PERM-002~007 联调必需) ─────
# 规范：service: hr_tdm → 引擎自动取 hr_tdm_base 拼接到 path 前
# 已实测可达地址（hr_tdm_base 与 hr_center_base 是公开 SIT 网关）
# 注意：base 不含 /api/ 段；call.path 里写 /api/xxx，由引擎自动拼接
hr_tdm_base: "http://sit-ha.fehorizon.com/femsp/hr-tdm"
hr_center_base: "http://sit-ha.fehorizon.com/femsp/hr-center"

# resourceCode 默认值（HI-PERM-002~006 已硬编码 VIEW_HISTORY，无需默认）
# 但建议同时声明 default_resource_code 兜底，避免后续场景漏写 resourceCode
default_resource_code: "VIEW_HISTORY"


# OSS 附件服务（文件上传/下载）
oss_base: "http://sit-ha.fehorizon.com/femsp/oss"
oss_download_base: "http://sit-ha.fehorizon.com/femsp/studybridge-sync"



# X-Api-Version 响应头校验：仅 sit-tdm 直连网关返回该头，sit-ha 代理入口会剥掉
# 走 sit-ha 时必须关闭（版本头校验应作为独立场景覆盖，而非全局强制）
check_version_header: false

# 测试账号池（AD 账号 + 工号，统一密码；别名供场景 as:/fetch_permission 引用）
accounts:
  default:   {ad: "caiyunfei", emp_no: "90024166"}   # 主测试账号（TDM_ADMIN：业务单元/职层/纵向三维 ALL）
  no_access: {ad: "caiyunfei", emp_no: "90024166"}   # fail-secure 场景专用（配合假资源码 SG_NONEXIST_RESOURCE 模拟无权限）
  internal:  {type: internal}                         # K-055：internal token 服务凭证（参数驱动接口专用）
  create: {ad: "caiyunfei", emp_no: "90024166"}
  # restricted: {ad: "TODO_AD", emp_no: "TODO_EMPNO"}  # 受限账号（单平台权限），待用户补充

# 数据库（只读账号，与 devops 技能 db_cli 同源；密码缺省时自动回退读取 devops .env.devops）
db:
  host: "mysql-sit03.fehorizon.com"
  port: 3306
  user: "mcp_read"
  password: "${SG_DB_PASSWORD:}"
  name: "hr_center"
  charset: "utf8mb4"
