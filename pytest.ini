[pytest]
testpaths = test_suites
# T-975：测试路径引导归一（替代各测试文件内 140+ 处 sys.path.insert）
# . = 仓库根包（engine/specstd/sg_core/mcp_server/agent/workbench.backend.*）
# workbench/backend = services 平铺风格存量 import
pythonpath = . workbench/backend scripts workbench/backend/scripts
addopts = -ra
markers =
    P0: 阻塞级用例
    P1: 重要用例
    resolver: 解析链场景
    permission: 权限过滤场景
    snapshot: 快照保真场景
    security: fail-secure 场景

# K-050：场景 tags 全量转 pytest mark（test_scenarios.py），未注册 tag 的告警属预期噪音，静默
filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning
